            <!-- Table Start -->
             {% include "layout/partials/admin/header.html" %}
            <div class="container-fluid pt-4 px-4">
                <div class="row g-4">
                    <div class="col-sm-12 col-xl-6">
                        <div class="bg-secondary rounded h-100 p-4">
                            <h6 class="mb-4">Location Table</h6>
                            <table class="table">
                                <thead>
                                    <tr>
                                        <th scope="col">#</th>
                                        <th scope="col">Location</th>
                                        <th scope="col">District</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {% for i in loc %}
                                    <tr>
                                        <th scope="row">{{forloop.counter}}</th>
                                        <td>{{i.name}}</td>
                                        <td>{{i.district.name}}</td>
                                        <td><a href="{% url 'app_core:locdl' i.id %}"><button class="btn btn-warning">Delete</button></a></td>
                                        <td><a href="{% url 'app_core:locup' i.id %}"><button class="btn btn-primary">Update</button></a></td>
 
                                    </tr> 
                                    {% endfor %}
                                </tbody>
                            </table>
                        </div>
                    </div>
                    
            {% include "layout/partials/admin/footer.html" %}
            <!-- Table End -->
