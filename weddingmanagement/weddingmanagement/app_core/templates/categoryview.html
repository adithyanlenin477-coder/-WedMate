{% include "layout/partials/admin/header.html" %}
 <div class="container-fluid pt-4 px-4">
                <div class="row g-4">
                    {% for i in cat %}
                    <div class="col-sm-6 col-xl-7">
                        <div class="bg-secondary rounded d-flex align-items-center justify-content-between p-4">
                            <img src="/media/{{i.image}}" style="width: 80px;">
                            <div class="ms-3">
                                <p class="mb-2">{{i.name}}</p>
                                <h6 class="mb-0">{{i.description}}</h6>

                            </div>
                     {% endfor %}
                        </div>
                    </div>
                </div>
 </div>                               
{% include "layout/partials/admin/footer.html" %}
