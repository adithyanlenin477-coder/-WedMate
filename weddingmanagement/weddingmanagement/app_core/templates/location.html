
            {% include "layout/partials/admin/header.html" %}
           <!-- Form Start -->
            <div class="container-fluid pt-4 px-4">
                <div class="row g-4">
                    <div class="col-sm-12 col-xl-6">
                        <div class="bg-secondary rounded h-100 p-4">
                            <h6 class="mb-4">Basic Form</h6>
                                <form action="{% url 'app_core:location' %}" method="post">
			                    {% csrf_token %}
                                <div class="mb-3">
                                    <label for="exampleInputLocation" class="form-label">Location</label>
                                    <input type="text" name="locname" class="form-control" id="exampleInputLocation">
                                </div>
                                    <select name="distname" class="form-control" id="exampleInputLocation">
                                        <option>-----Select district-----</option>
                                        {% for i in dis %}
                                        <option value="{{i.id}}">{{ i.name }}</option>
                                        {% endfor %}
                                    </select>
                                </div> 
                                <button type="submit" class="btn btn-primary">Submit</button>
                            </form>
                        </div>
                    </div>
            {% include "layout/partials/admin/footer.html" %}
