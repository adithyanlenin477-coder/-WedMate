{% load static %}
{% include 'layout/partials/admin/header.html' %}
<div class="container-fluid pt-4 px-4">
    <div class="row g-4">
        <div class="col-sm-12 col-xl-6">
            <div class="bg-secondary rounded h-100 p-4">
                <h6 class="mb-4">Category Edit</h6>
                <form method="post" action="{% url 'app_core:catup' catv.id %}" enctype="multipart/form-data">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="name" class="label">Name</label>
                        <input type="text" class="form-control" id="exampleInputEmail1" name="name" value="{{ catv.name }}"
                            aria-describedby="emailHelp">
                        <div id="emailHelp" class="form-text">We'll never share your email with anyone else.
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="name" class="label">description</label>
                        <input type="text" class="form-control" id="exampleInputEmail1" name="description" value="{{ catv.description }}"
                            aria-describedby="emailHelp">
                        <div id="emailHelp" class="form-text">We'll never share your email with anyone else.
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="name" class="label">Image</label>
                        <img src="/media/{{catv.image}}" style="width: 200px;">
                        <input type="file" class="form-control" id="exampleInputEmail1" name="img"
                            aria-describedby="emailHelp">
                        <div id="emailHelp" class="form-text">We'll never share your email with anyone else.
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary">Update</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% include 'layout/partials/admin/footer.html' %}
