{% load static %}
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

<style>

/* ================= GLOBAL ================= */
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: #000;
}

/* ================= HOME BUTTON ================= */

.home-btn{
    position:absolute;
    top:30px;
    left:40px;
    z-index:20;
    padding:10px 24px;
    border-radius:25px;
    border:1px solid #D4AF37;
    color:#D4AF37;
    text-decoration:none;
    font-size:14px;
    transition:0.3s;
}

.home-btn:hover{
    background:#D4AF37;
    color:black;
}

/* ================= SPLIT SCREEN ================= */

.login-wrapper {
    display: flex;
    min-height: 100vh;
    position: relative;
}


/* ================= LEFT SIDE ================= */

.brand-section {
    flex: 1;
    position: relative;
    background-position: center 10%;
    background-size: cover;
    background-repeat: no-repeat;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 75px;
    color: #ffffff;
    overflow: hidden;
}

.brand-section::before {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    z-index: 1;
}

.brand-content {
    position: relative;
    z-index: 2;
}

.brand-title {
    font-family: 'Playfair Display', serif;
    font-size: 60px;
    font-weight: 700;
    margin-bottom: 20px;
}

.brand-tagline {
    font-size: 18px;
    max-width: 450px;
    line-height: 1.7;
    opacity: 0.95;
}

/* ================= RIGHT SIDE ================= */

.form-section {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    overflow: hidden;
    background: linear-gradient(-45deg, #000000, #111111, #1a1a1a, #000000);
    background-size: 400% 400%;
    animation: bgMove 15s ease infinite;
}

@keyframes bgMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

.form-section::before {
    content: "";
    position: absolute;
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, rgba(212,175,55,0.18), transparent 70%);
    top: -120px;
    right: -120px;
    filter: blur(100px);
}

/* ================= LOGIN CARD ================= */

.login-card {
    width: 100%;
    max-width: 460px;
    padding: 65px 55px;
    border-radius: 28px;
    background: rgba(15, 15, 15, 0.75);
    backdrop-filter: blur(40px);
    border: 1px solid rgba(212,175,55,0.15);
    box-shadow:
        0 60px 150px rgba(0,0,0,0.95),
        0 0 60px rgba(212,175,55,0.15);
    color: #ffffff;
    position: relative;
}

.login-card::before {
    content: "";
    position: absolute;
    top: 0;
    left: 30%;
    width: 40%;
    height: 3px;
    background: linear-gradient(90deg, transparent, #D4AF37, transparent);
}

/* Header */

.login-card h2 {
    font-family: 'Playfair Display', serif;
    font-size: 40px;
    margin-bottom: 10px;
}

.login-subtitle {
    color: #c4c4c4;
    margin-bottom: 45px;
    font-size: 14px;
}

/* Inputs */

.form-group {
    margin-bottom: 30px;
}

.login-card input {
    width: 100%;
    padding: 18px;
    border-radius: 16px;
    border: 1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.05);
    color: #fff;
    font-size: 15px;
}

.login-card input:focus {
    outline: none;
    border-color: #D4AF37;
    box-shadow: 0 0 20px rgba(212,175,55,0.25);
}

/* Button */

.login-btn {
    width: 100%;
    padding: 18px;
    border-radius: 16px;
    border: none;
    background: linear-gradient(135deg, #B88A2F, #D4AF37);
    color: #fff;
    font-weight: 600;
    letter-spacing: 1px;
    cursor: pointer;
}

.login-btn:hover {
    transform: translateY(-3px);
}

/* Links */

.extra-links {
    text-align: center;
    margin-top: 40px;
    font-size: 14px;
    color: #9ca3af;
}

.extra-links a {
    color: #D4AF37;
    text-decoration: none;
}

/* Responsive */

@media (max-width: 992px) {
    .login-wrapper {
        flex-direction: column;
    }
}

</style>


<div class="login-wrapper">

<!-- HOME BUTTON -->

<a href="{% url 'app_dashboard:home' %}" class="home-btn">
Home
</a>

<!-- LEFT SIDE -->

<div class="brand-section"
     style="background-image: url({% static 'vendor/assets/images/loginimage.jpg' %});">

    <div class="brand-content">
        <div class="brand-title">WedMate</div>
        <div class="brand-tagline">
            Crafting unforgettable wedding experiences with elegance,
            precision, and timeless luxury.
        </div>
    </div>

</div>


<!-- RIGHT SIDE -->

<div class="form-section">

<div class="login-card">

<h2>Welcome</h2>

<div class="login-subtitle">
Sign in to continue to your dashboard
</div>

<form action="{% url 'app_dashboard:login' %}" method="POST">

{% csrf_token %}

<div class="form-group">
<input type="text" name="name" placeholder="Username" required>
</div>

<div class="form-group">
<input type="password" name="password" placeholder="Password" required>
</div>

<button type="submit" class="login-btn">
Sign In
</button>

</form>

<div class="extra-links">

Don't have an account?

<a href="{% url 'app_dashboard:select_role' %}">
Create Account
</a>

</div>

</div>

</div>

</div>
