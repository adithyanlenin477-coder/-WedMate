{% load static %}
{% include "layout/partials/guest/header.html" %}

<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap');

body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: #f8f4f0;
}

/* ===== Split Layout ===== */
.register-section {
    min-height: 100vh;
    display: flex;
}

/* Left Luxury Panel */
.left-panel {
    flex: 1;
    background: linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)),
                url("{% static 'guest/assets/img/gallery/gallery1.jpg' %}");
    background-size: cover;
    background-position: center;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    text-align: center;
    padding: 60px;
}

.left-panel h1 {
    font-family: 'Playfair Display', serif;
    font-size: 42px;
    letter-spacing: 2px;
    animation: fadeIn 1.5s ease;
}

.left-panel p {
    margin-top: 20px;
    font-size: 15px;
    opacity: 0.9;
    animation: fadeIn 2s ease;
}

@keyframes fadeIn {
    from {opacity:0; transform:translateY(30px);}
    to {opacity:1; transform:translateY(0);}
}

/* Right Form Panel */
.right-panel {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg,#fff,#fcefee);
    padding: 40px;
}

/* Card */
.form-card {
    width: 100%;
    max-width: 480px;
    padding: 50px 40px;
    border-radius: 20px;
    background: white;
    box-shadow: 0 20px 60px rgba(0,0,0,0.08);
    animation: slideUp 1s ease;
}

@keyframes slideUp {
    from {opacity:0; transform:translateY(50px);}
    to {opacity:1; transform:translateY(0);}
}

.form-title {
    font-family: 'Playfair Display', serif;
    font-size: 30px;
    font-weight: 600;
    text-align: center;
    margin-bottom: 35px;
    letter-spacing: 1.5px;
    color: #2c2c2c;
    position: relative;
}

/* Elegant underline */
.form-title::after {
    content: "";
    width: 60px;
    height: 2px;
    background-color: #b76e79;
    display: block;
    margin: 12px auto 0;
    border-radius: 2px;
}




/* Inputs */
.form-group {
    margin-bottom: 18px;
}

.form-group input {
    width: 100%;
    padding: 14px 15px;
    border-radius: 10px;
    border: 1px solid #eee;
    transition: 0.3s;
    font-size: 14px;
}

.form-group input:focus {
    border-color: #b76e79;
    box-shadow: 0 0 8px rgba(183,110,121,0.2);
    outline: none;
}

/* Button */
.register-btn {
    width: 100%;
    padding: 14px;
    border-radius: 30px;
    border: none;
    background: linear-gradient(45deg,#b76e79,#ff9a9e);
    color: white;
    font-weight: 600;
    letter-spacing: 1px;
    transition: 0.3s;
}

.register-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 25px rgba(183,110,121,0.3);
}

/* Responsive */
@media(max-width:992px){
    .register-section{
        flex-direction: column;
    }
    .left-panel{
        min-height: 300px;
    }
}
</style>

<div class="register-section">

    <!-- Left Side Luxury Branding -->
    <div class="left-panel">
        <div>
            <h1>Celebrate Your Forever</h1>
            <p>Join our premium wedding platform and start planning your dream celebration with elegance and perfection.</p>
        </div>
    </div>

    <!-- Right Side Form -->
    <div class="right-panel">
        <div class="form-card">

            <h2 class="form-title">Customer Registration</h2>

            <form action="{% url 'app_dashboard:customerreg' %}" method="POST">
                {% csrf_token %}

                <div class="form-group">
                    <input type="text" name="name" placeholder="Username"
                        required minlength="8">
                </div>

                <div class="form-group">
                    <input type="password" name="password" placeholder="Password"
                        required minlength="8" title="Password must be at least 8 characters long.>
                </div>

                <div class="form-group">
                    <input type="email" name="email" placeholder="Email Address"
                        required>
                </div>

                <div class="form-group">
                    <input type="text" name="address" placeholder="Address"
                        required>
                </div>

                <div class="form-group">
                    <input type="text" name="contact" placeholder="Contact Number"
                        required pattern="[0-9]{10}">
                </div>

                <div class="form-group">
                    <input type="text" name="location" placeholder="Location"
                        required>
                </div>

                <button type="submit" class="register-btn">
                    Create Account
                </button>

            </form>

        </div>
    </div>

</div>

{% include "layout/partials/guest/footer.html" %}
