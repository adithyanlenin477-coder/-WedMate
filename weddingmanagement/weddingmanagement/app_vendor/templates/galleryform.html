{% load static %}
{% include "layout/partials/guest/header.html" %}
<div class="contact-form section-padding30 fix">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-xl-5 col-lg-5">
                <div class="form-wrapper">
                    <form id="contact-form" action="{% url 'app_vendor:gallery' %}" method="POST" enctype="multipart/form-data">
                        {% csrf_token %}
                        <!-- section tittle -->
                        <div class="row ">
                            <div class="col-lg-12">
                                <div class="section-tittle tittle-form text-center mb-30">
                                    <h2>SERVICE REGISTRATION</h2>
                                    <img src="{% static 'guest/assets/img/gallery/tittle_img2.png' %}" alt="">
                                </div>
                            </div>
                        </div>
                        <div class="form-box subject-icon mb-30">
                           <label for="">Services</label><br>
                           <select name="service_id" id=""class="form-control">
                            <option value="">Choose </option>
                                {% for i in services %}
                                <option value="{{i.service.id}}">{{i.service.name}}</option>
                                {% endfor %}
                           </select>
                            
                        </div>
                        <div class="form-box mb-35">
                            <label class="">Upload Image</label>
                            <input type="file" name="image" class="form-control">
                        </div>

                        <div class="submit-info">
                            <button class="btn" type="submit">Register</button>
                        </div>
                    </form>
                    <!-- Shape inner Flower -->
                    <div class="shape-inner-flower">
                        <img src="{% static 'guest/assets/img/gallery/shape2.png' %}" class="shpe2" alt="">
                    </div>
                    <!-- Shape outer Flower -->
                    <div class="shape-outer-flower">
                        <img src="{% static 'guest/assets/img/flower/from-top.png' %}" class="outer-top" alt="">
                        <img src="{% static 'guest/assets/img/flower/from-bottom.png' %}" class="outer-bottom" alt="">
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% include "layout/partials/guest/footer.html" %}
