{% load static %}
{% include 'layout/partials/guest/header.html' %}

<div class="container-fluid mt-4">
    <div class="card shadow-sm">
        <div class="card-header bg-dark text-white">
            <h5 class="mb-0">Gallery</h5>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle text-center">
                    <thead class="table-dark">
                        <tr>
                            <th scope="col">#</th>
                            <th scope="col">Vendor</th>
                            <th scope="col">Service</th>
                            <th scope="col">Image</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for g in galleries %}
                        <tr>
                            <th scope="row">{{ forloop.counter }}</th>
                            <td>{{ g.vendor.username }}</td>
                            <td>{{ g.service.name }}</td>
                            <td>
                                <img src="/media/{{ g.image }}" alt="Gallery Image" class="img-thumbnail" style="max-width: 150px;">
                            </td>
                        </tr>
                        {% empty %}
                        <tr>
                            <td colspan="4" class="text-center">No images uploaded yet.</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

{% include 'layout/partials/guest/footer.html' %}
