{% load static %}
{% include "layout/partials/guest/header.html" %}

<div class="contact-form section-padding30 fix">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-xl-8 col-lg-8">
                <div class="form-wrapper">

                    <form method="POST" enctype="multipart/form-data">
                        {% csrf_token %}

                        <div class="section-tittle text-center mb-40">
                            <h2>Set Hourly Charges</h2>
                            <p>Update your venue hourly pricing details</p>
                        </div>

                        {% for s in service %}
                        <div class="card mb-4 p-4 shadow-sm" style="border-radius:12px;">
                            
                            <input type="hidden" name="service_id[]" value="{{ s.id }}">

                            <h5 class="mb-3">{{ s.service.name }}</h5>

                            <!-- Hourly Amount -->
                            <div class="form-group mb-3">
                                <label>Hourly Charge (₹)</label>
                                <input type="number" 
                                       name="amount[]" 
                                       value="{{ s.amount }}" 
                                       class="form-control" 
                                       placeholder="Enter hourly charge"
                                       required>
                            </div>

                            <!-- Hours -->
                            <div class="form-group mb-3">
                                <label>Available Hours</label>
                                <input type="number" 
                                       name="hours[]" 
                                       value="{{ s.hours }}" 
                                       class="form-control" 
                                       placeholder="Enter available hours"
                                       required>
                            </div>

                            <!-- Image -->
                            <div class="form-group">
                                <label>Update Image</label>
                                <input type="file" name="image[]" class="form-control">
                            </div>

                        </div>
                        {% endfor %}

                        <div class="text-center">
                            <button type="submit" class="btn btn-primary px-5">
                                Update Details
                            </button>
                        </div>

                    </form>

                </div>
            </div>
        </div>
    </div>
</div>

{% include "layout/partials/guest/footer.html" %}
