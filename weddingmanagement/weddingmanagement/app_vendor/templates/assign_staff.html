{% include 'layout/partials/vendor/header.html' %}

<style>
  body {
    background: linear-gradient(135deg, #f8f9fa, #eef2f7);
  }

  .assign-wrapper {
    margin-top: 80px;
    margin-bottom: 80px;
  }

  .assign-card {
    border-radius: 18px;
    background: #ffffff;
    box-shadow: 0 15px 40px rgba(0, 0, 0, 0.08);
    transition: 0.3s ease-in-out;
  }

  .assign-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.12);
  }

  .assign-title {
    font-weight: 700;
    font-size: 22px;
    color: #2c3e50;
  }

  .customer-info {
    background: #f1f5f9;
    padding: 12px 18px;
    border-radius: 10px;
    font-size: 14px;
    color: #555;
  }

  .form-label {
    font-size: 14px;
    color: #444;
  }

  .form-select {
    height: 50px;
    border-radius: 12px;
    border: 1px solid #dce3ea;
    transition: 0.3s;
  }

  .form-select:focus {
    border-color: #0d6efd;
    box-shadow: 0 0 0 0.2rem rgba(13,110,253,.15);
  }

  .btn-assign {
    background: linear-gradient(135deg, #28a745, #20c997);
    border: none;
    padding: 10px 28px;
    border-radius: 30px;
    font-weight: 600;
    transition: 0.3s;
  }

  .btn-assign:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(40,167,69,0.3);
  }

  .btn-cancel {
    border-radius: 30px;
    padding: 10px 28px;
  }

  .booking-badge {
    background: #0d6efd;
    color: #fff;
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
  }
</style>

<div class="container assign-wrapper">
  <div class="card assign-card p-5 border-0">

    <!-- Header Section -->
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h4 class="assign-title mb-0">
        Assign Staff
      </h4>
      <span class="booking-badge">
        Booking #{{ booking.id }}
      </span>
    </div>

    <!-- Customer Info -->
    <div class="customer-info mb-4">
      <strong>Customer:</strong> {{ booking.customer.username }}
    </div>

    <form method="POST">
      {% csrf_token %}

      <div class="mb-4">
        <label class="form-label fw-semibold">Select Staff Member</label>

        <select name="staff_id" class="form-select" required>
          <option value="" disabled selected>-- Choose Staff --</option>

          {% for staff in staff_members %}
          <option value="{{ staff.id }}">
            {{ staff.user.username }} | {{ staff.phno }} | {{ staff.location }}
          </option>
          {% empty %}
          <option disabled>No staff available</option>
          {% endfor %}
        </select>
      </div>

      <!-- Buttons -->
      <div class="d-flex gap-3">
        <button type="submit" class="btn btn-assign text-white">
          Assign Now
        </button>

        <a href="{% url 'app_vendor:vendor_bookings' %}"
           class="btn btn-outline-secondary btn-cancel">
          Cancel
        </a>
      </div>

    </form>

  </div>
</div>

{% include 'layout/partials/vendor/footer.html' %}
