  {% load static %}
  {% include "layout/partials/guest/header.html" %}
  <div class="contact-form section-padding30 fix">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-xl-5 col-lg-5">
                    <div class="form-wrapper">
                        <form id="contact-form" action="{% url 'app_vendor:staff' %}" method="POST">
                            {% csrf_token %}
                            <!-- section tittle -->
                            <div class="row ">
                                <div class="col-lg-12">
                                    <div class="section-tittle tittle-form text-center mb-30">
                                        <h2>STAFF REGISTRATION</h2>
                                        <img src="{% static 'guest/assets/img/gallery/tittle_img2.png' %}" alt="">
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-lg-12">
                                    <div class="form-box mb-30">
                                        <input type="text" name="name" placeholder="Username">
                                    </div>
                                </div>
                                <div class="col-lg-12">
                                    <div class="form-box subject-icon mb-30">
                                        <input type="password" name="password" placeholder="Password">
                                    </div>
                                </div>
                                <!-- <div class="col-lg-12">
                                    <div class="form-box subject-icon mb-30">
                                        <input type="text" name="name" placeholder="Name">
                                    </div>
                                </div> -->
                               
                                <div class="col-lg-12">
                                    <div class="form-box subject-icon mb-30">
                                        <input type="email" name="email" placeholder="Email">
                                    </div>
                                </div>
                                <div class="col-lg-12">
                                <div class="form-box mb-30">
                                    <label for="gender">Gender</label>
                                    <select name="gender" id="gender" class="form-control">
                                        <option value="">-- Select Gender --</option>
                                        <option value="Male">Male</option>
                                        <option value="Female">Female</option>
                                    </select>
                                </div>
                            </div>

                                <div class="col-lg-12">
                                    <div class="form-box subject-icon mb-30">
                                        <input type="text" name="phone" placeholder="Phone Number">
                                    </div>
                                </div>
                                <div class="col-lg-12">
                                    <div class="form-box subject-icon mb-30">
                                        <input type="text" name="location" placeholder="Location">
                                    </div>
                                </div>  
                                <div class="col-lg-12">
                                
                                <div class="submit-info">
                                    <button class="btn" type="submit">Register</button>
                                </div>
                                </div>
                            </div>
                        </form>
                        <!-- Shape inner Flower -->
                        <div class="shape-inner-flower">
                            <img src="{% static 'guest/assets/img/gallery/shape2.png' %}" class="shpe2" alt="">
                        </div>
                        <!-- Shape outer Flower -->
                        <div class="shape-outer-flower">
                            <img src="{% static 'guest/assets/img/flower/from-top.png' %}" class="outer-top" alt="">
                            <img src="{% static 'guest/assets/img/flower/from-bottom.png' %}" class="outer-bottom" alt="">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    {% include "layout/partials/guest/footer.html" %}
