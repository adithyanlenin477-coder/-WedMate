{% load static %}
{% include 'layout/partials/customer/header.html' %}

<section class="our-courses" id="courses">
  <div class="container">
    <div class="row">
      <div class="col-lg-12">
        <div class="section-heading">
          <h2>Providing services</h2>
        </div>
      </div>

      <div class="col-lg-12">
        <div class="owl-courses-item owl-carousel">

          {% for i in cat %}
          <div class="item">
            <!-- PASS SERVICE ID CORRECTLY -->
            <a href="{% url 'app_customer:price' i.id cid %}">
              <img src="/media/{{ i.image }}" alt="{{ i.name }}" style="height: 200px;">
            </a>

            <div class="down-content" style="height:75px">
              <h4>{{ i.name }}</h4>
            </div>
          </div>
          {% endfor %}

        </div>
      </div>
    </div>
  </div>
</section>

{% include 'layout/partials/customer/footer.html' %}
