{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Select Date & Time | WedMate</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:'Poppins',sans-serif;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background: linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.85)),
                        url("{% static 'customer/assets/img/hero/background.jpg' %}") center/cover no-repeat;
        }

        /* ================= PREMIUM CARD ================= */

        .datetime-card{
            width:100%;
            max-width:520px;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(18px);
            padding:55px 45px;
            border-radius:25px;
            box-shadow:0 30px 80px rgba(0,0,0,0.6);
            text-align:center;
            animation: fadeUp .8s ease;
            border:1px solid rgba(255,255,255,0.15);
        }

        @keyframes fadeUp{
            from{
                opacity:0;
                transform:translateY(40px);
            }
            to{
                opacity:1;
                transform:translateY(0);
            }
        }

        /* ================= STEP INDICATOR ================= */

        .step-indicator{
            margin-bottom:25px;
            font-size:13px;
            color:#ccc;
            letter-spacing:1px;
        }

        .step-indicator span{
            color:#FFD700;
            font-weight:600;
        }

        /* ================= HEADING ================= */

        .datetime-card h2{
            font-family:'Playfair Display',serif;
            font-size:32px;
            margin-bottom:10px;
            background: linear-gradient(90deg,#C6A75E,#FFD700,#C6A75E);
            -webkit-background-clip:text;
            -webkit-text-fill-color:transparent;
        }

        .datetime-card p{
            color:#ddd;
            font-size:14px;
            margin-bottom:35px;
            line-height:1.6;
        }

        /* ================= FORM ================= */

        .form-group{
            margin-bottom:25px;
            text-align:left;
        }

        label{
            color:#fff;
            font-size:13px;
            margin-bottom:8px;
            display:block;
        }

        input{
            width:100%;
            padding:14px;
            border-radius:10px;
            border:1px solid rgba(255,255,255,0.2);
            background:rgba(255,255,255,0.1);
            color:#fff;
            font-size:14px;
            outline:none;
            transition:.3s ease;
        }

        input:focus{
            border:1px solid #FFD700;
            box-shadow:0 0 15px rgba(255,215,0,0.4);
        }

        /* ================= BUTTON ================= */

        .continue-btn{
            width:100%;
            padding:15px;
            border-radius:50px;
            border:none;
            background: linear-gradient(90deg,#C6A75E,#FFD700,#C6A75E);
            font-weight:600;
            letter-spacing:1px;
            cursor:pointer;
            transition:.3s ease;
            position:relative;
            overflow:hidden;
        }

        .continue-btn:hover{
            transform:translateY(-3px);
            box-shadow:0 15px 35px rgba(255,215,0,0.4);
        }

        /* Shine animation */
        .continue-btn::before{
            content:"";
            position:absolute;
            top:0;
            left:-100%;
            width:100%;
            height:100%;
            background:linear-gradient(
                120deg,
                transparent,
                rgba(255,255,255,0.5),
                transparent
            );
            transition:.6s;
        }

        .continue-btn:hover::before{
            left:100%;
        }

        /* ================= RESPONSIVE ================= */

        @media(max-width:576px){
            .datetime-card{
                padding:40px 25px;
            }

            .datetime-card h2{
                font-size:24px;
            }
        }

    </style>
</head>

<body>

<div class="datetime-card">

    <div class="step-indicator">
        Step <span>2</span> of 3
    </div>

    <h2>Select Your Wedding Date & Time</h2>
    <p>
        Choose your preferred schedule for 
        <strong style="color:#FFD700;">{{ event.name }}</strong>
    </p>

    <form method="POST" action="{% url 'app_customer:event_datetime' event.id %}">
        {% csrf_token %}

        <div class="form-group">
            <label>Select Event Date</label>
            <input type="date" name="date" required>
        </div>

        <div class="form-group">
            <label>Select Event Time</label>
            <input type="time" name="time" required>
        </div>

        <button type="submit" class="continue-btn">
            Continue to Services →
        </button>
    </form>

</div>

</body>
</html>
