{% load static %}
{% include 'layout/partials/customer/header.html' %}

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>

/* ================= SECTION WITH BACKGROUND ================= */

.premium-events {
    position: relative;
    padding: 120px 0;
    background: url("{% static 'customer/assets/img/hero/background.jpg' %}") center/cover no-repeat;
    overflow: hidden;
}

/* Dark overlay */
.premium-events::before {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.75);
}

.premium-events .container {
    position: relative;
    z-index: 2;
}

/* ================= HEADING ================= */

.section-header {
    text-align: center;
    margin-bottom: 70px;
}

.premium-title {
    font-family: 'Playfair Display', serif;
    font-size: 52px;
    font-weight: 700;
    background: linear-gradient(90deg, #C6A75E, #FFD700, #C6A75E);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.premium-subtitle {
    margin-top: 15px;
    font-size: 17px;
    color: #ddd;
    max-width: 750px;
    margin-left: auto;
    margin-right: auto;
}

/* ================= COVERFLOW ================= */

.coverflow-container {
    position: relative;
    height: 420px;
    perspective: 1400px;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* CARD */
.cover-card {
    position: absolute;
    width: 500px;
    height: 320px;
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,0.4);
    transition: 1s ease;
    opacity: 0;
    cursor: pointer;
}

.cover-card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* Overlay */
.card-overlay {
    position: absolute;
    bottom: 0;
    width: 100%;
    padding: 25px;
    background: linear-gradient(to top, rgba(0,0,0,0.9), rgba(0,0,0,0.2));
}

.card-overlay h4 {
    font-family: 'Playfair Display', serif;
    font-size: 24px;
    color: #FFD700;
}

/* POSITION CLASSES */

.cover-card.left {
    transform: translateX(-420px) rotateY(35deg) scale(0.88);
    opacity: 0.6;
    z-index: 1;
}

.cover-card.center {
    transform: translateX(0) rotateY(0deg) scale(1);
    opacity: 1;
    z-index: 3;
}

.cover-card.right {
    transform: translateX(420px) rotateY(-35deg) scale(0.88);
    opacity: 0.6;
    z-index: 1;
}

/* ================= NAVIGATION BUTTONS ================= */

.cover-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 55px;
    height: 55px;
    border-radius: 50%;
    border: none;
    background: rgba(0,0,0,0.6);
    color: #FFD700;
    font-size: 26px;
    cursor: pointer;
    backdrop-filter: blur(6px);
    transition: 0.4s ease;
    z-index: 5;
}

.cover-btn:hover {
    background: #FFD700;
    color: #000;
    transform: translateY(-50%) scale(1.15);
}

.prev-btn { left: 40px; }
.next-btn { right: 40px; }

/* ================= RESPONSIVE ================= */

@media (max-width: 768px) {

    .cover-card {
        width: 320px;
        height: 220px;
    }

    .cover-card.left {
        transform: translateX(-220px) rotateY(30deg) scale(0.85);
    }

    .cover-card.right {
        transform: translateX(220px) rotateY(-30deg) scale(0.85);
    }

    .premium-title {
        font-size: 34px;
    }
}

</style>

<section class="premium-events">
    <div class="container">

        <!-- HEADING -->
        <div class="section-header">
            <h2 class="premium-title">Select Your Perfect Event</h2>
            <p class="premium-subtitle">
                Discover our luxury curated wedding experiences crafted with elegance and perfection.
            </p>
        </div>

        <!-- COVERFLOW -->
        <div class="coverflow-container">

            <!-- Navigation Buttons -->
            <button class="cover-btn prev-btn">&#10094;</button>
            <button class="cover-btn next-btn">&#10095;</button>

            {% for i in evnt %}
            <a href="{% url 'app_customer:event_datetime' i.id %}" class="cover-card">
                <img src="/media/{{i.image}}" alt="{{i.name}}">
                <div class="card-overlay">
                    <h4>{{i.name}}</h4>
                </div>
            </a>
            {% endfor %}

        </div>

    </div>
</section>

{% include 'layout/partials/customer/footer.html' %}

<script>

let cards = document.querySelectorAll(".cover-card");
let index = 0;
let total = cards.length;

const nextBtn = document.querySelector(".next-btn");
const prevBtn = document.querySelector(".prev-btn");

function updateCards() {

    cards.forEach(card => {
        card.classList.remove("left", "center", "right");
    });

    if(total < 3) return;

    cards[index].classList.add("center");
    cards[(index + 1) % total].classList.add("right");
    cards[(index - 1 + total) % total].classList.add("left");
}

/* Next Button */
nextBtn.addEventListener("click", () => {
    index = (index + 1) % total;
    updateCards();
});

/* Previous Button */
prevBtn.addEventListener("click", () => {
    index = (index - 1 + total) % total;
    updateCards();
});

/* Auto Slide */
setInterval(() => {
    index = (index + 1) % total;
    updateCards();
}, 4500);

updateCards();

</script>
