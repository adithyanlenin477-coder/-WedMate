{% load static %}
{% include 'layout/partials/customer/header.html' %}

<section class="upcoming-meetings">
  <div class="container">
    <div class="row justify-content-center">

      <div class="col-md-6">
        <div class="card shadow">
          <div class="card-body">

            <h3 class="text-center mb-3">Book Service</h3>

            <form method="POST">
              {% csrf_token %}

              <!-- Grand Total -->
              <div class="mb-3">
                <label class="form-label">Grand Total</label>
                <input type="text" name="grandtotal" class="form-control" value="{{grandtotal}}" readonly>
              </div>

              <!-- Event Date -->
              <div class="mb-3">
                <label class="form-label">Event Date</label>
                <input type="date" name="event_date" class="form-control" value="{{date}}" required>
              </div>

              <!-- Auditorium Need -->
              <div class="mb-3">
                <label class="form-label">Do you need an auditorium?</label>
                <input type="checkbox" name="auditoriumneed" id="needed">
              </div>

              <!-- Venue -->
              <div class="mb-3" id="venueField">
                <label class="form-label">Venue</label>
                <input type="text" name="venue" class="form-control" required>
              </div>

              <!-- Auditorium Dropdown -->
              <div class="mb-3" id="auditoriumField" style="display:none;">
                <label class="form-label">Select Auditorium</label>
                <select name="auditorium" class="form-control">
                  <option value="">Choose Auditorium</option>
                  {% for i in auditorium %}
                  <option value="{{i.id}}">{{i.name}}</option>
                  {% endfor %}
                </select>
              </div>

              <!-- Booking Type -->
              <div class="mb-3" id="timingTypeField" style="display:none;">
                <label class="form-label">Booking Type</label>
                <select name="booking_type" class="form-control">
                  <option value="">Select Type</option>
                  <option value="half_day">Half Day</option>
                  <option value="full_day">Full Day</option>
                </select>
              </div>

              <!-- Participants -->
              <div class="mb-3">
                <label class="form-label">Number of Participants</label>
                <input type="number" name="number_of_participants" class="form-control" min="1" required>
              </div>

              <!-- Event Time -->
              <div class="mb-3">
                <label class="form-label">Event Time</label>
                <input type="time" name="time" class="form-control" value="{{time}}" required>
              </div>

              <!-- Note -->
              <div class="mb-3">
                <label class="form-label">Note (optional)</label>
                <textarea name="note" class="form-control" rows="3"></textarea>
              </div>

              <button type="submit" class="btn btn-primary w-100">
                Confirm Booking
              </button>

            </form>

          </div>
        </div>
      </div>

    </div>
  </div>
</section>

<script>

const checkbox = document.getElementById("needed");
const venueInput = document.querySelector("input[name='venue']");
const auditoriumSelect = document.querySelector("select[name='auditorium']");
const venueField = document.getElementById("venueField");
const auditoriumField = document.getElementById("auditoriumField");
const timingTypeField = document.getElementById("timingTypeField");

checkbox.addEventListener("change", function() {

    if (this.checked) {

        venueField.style.display = "none";
        auditoriumField.style.display = "block";
        timingTypeField.style.display = "block";

        venueInput.removeAttribute("required");
        auditoriumSelect.setAttribute("required","required");

    } else {

        venueField.style.display = "block";
        auditoriumField.style.display = "none";
        timingTypeField.style.display = "none";

        venueInput.setAttribute("required","required");
        auditoriumSelect.removeAttribute("required");

    }

});

</script>

{% include 'layout/partials/customer/footer.html' %}
